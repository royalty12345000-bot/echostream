<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Royalstream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="royalst.png">
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <img src="royalstream.png" class="logo-img" alt="RoyalStream logo" onerror="this.style.display='none'">
            <div class="logo-text">
                <h1>RoyalStream</h1>
                <p>Full tracks · RoyalStream · your personal library</p>
            </div>
        </div>
        <div class="search-row">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search for songs, artists, tags...">
            </div>
            <button id="searchBtn" class="search-btn"><i class="fas fa-arrow-right"></i> Go</button>
        </div>
    </div>

    <div class="tracks-panel">
        <div class="section-badge"><i class="fas fa-compact-disc"></i> 500+ SUGGESTIONS · FULL TRACKS</div>
        <div id="trackListContainer" class="track-list">
            <div class="loading-message"><i class="fas fa-spinner fa-pulse"></i> Loading your library from Royalstream...</div>
        </div>
    </div>

    <footer>🎵 Powered by Royalstream · full‑length tracks from independent artists</footer>
</div>

<div class="now-playing-bar" id="nowPlayingBar">
    <div class="bar-left">
        <div class="bar-art" id="albumArtContainer">
            <i class="fas fa-music"></i>
        </div>
        <div class="bar-meta">
            <div class="bar-title" id="currentTitle">—</div>
            <div class="bar-artist" id="currentArtist">Select a track to play</div>
        </div>
    </div>

    <div class="bar-center">
        <div class="bar-controls">
            <button id="prevButton" title="Previous"><i class="fas fa-backward-step"></i></button>
            <button id="playPauseButton" class="bar-play-btn" title="Play / Pause"><i class="fas fa-play"></i></button>
            <button id="nextButton" title="Next"><i class="fas fa-forward-step"></i></button>
        </div>
        <div class="bar-progress-wrap">
            <span id="currentTimeLabel" class="bar-time">0:00</span>
            <div class="progress-bg" id="progressBg">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="durationLabel" class="bar-time">0:00</span>
        </div>
    </div>

    <div class="bar-right">
        <i class="fas fa-volume-low bar-vol-icon"></i>
        <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.7">
        <i class="fas fa-volume-high bar-vol-icon"></i>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
