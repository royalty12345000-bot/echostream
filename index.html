<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover"
    />
    <title>Royalstream</title>

    <!-- PWA Requirements -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7c5cff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RoyalStream" />
    <link rel="apple-touch-icon" href="royalst.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="royalst.png" />
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Pull-to-refresh indicator -->
      <div class="pull-to-refresh" id="pullToRefresh">
        <span class="refresh-icon"><i class="fas fa-sync-alt"></i></span>
        <span>Pull down to refresh</span>
      </div>

      <main id="mainContent" class="main-content">
        <!-- HOME SCREEN -->
        <section id="homeScreen" class="screen active">
          <div class="welcome-banner">
            <a href="https://github.com/royaltydev001/royalstream.app/releases/download/v1.0.0/RoyalStream.apk" class="download-app-btn" aria-label="Download mobile app" download="RoyalStream.apk">
              <i class="fas fa-mobile-alt"></i>
              <span>Download App</span>
            </a>
            <div class="banner-content">
              <h1 class="banner-title">Welcome to RoyalStream</h1>
              <p class="banner-subtitle">
                Listen like royalty. Unlimited independent music.
              </p>
              <div class="banner-decoration">
                <i class="fas fa-crown"></i>
              </div>
            </div>
          </div>
          <div class="home-section">
            <div class="section-label">Popular Artists</div>
            <div
              id="popularArtistsContainer"
              class="horizontal-scroll artist-row"
            ></div>
          </div>
          <div class="home-section">
            <div class="section-label">Trending Songs</div>
            <div id="trendingContainer" class="track-list"></div>
          </div>
        </section>

        <!-- SEARCH SCREEN -->
        <section id="searchScreen" class="screen">
          <div class="screen-header">
            <h2 class="screen-title">Search</h2>
          </div>
          <div class="search-container">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input
                type="text"
                id="searchInput"
                placeholder="Artists, songs, or albums..."
              />
            </div>
            <button id="searchBtn" class="search-btn">Search</button>
          </div>
          <div id="searchResultsContainer" class="track-list"></div>
        </section>

        <!-- LIBRARY SCREEN -->
        <section id="libraryScreen" class="screen">
          <div class="screen-header">
            <h2 class="screen-title">Your Library</h2>
          </div>
          <div class="library-tabs">
            <button class="lib-tab active" data-tab="playlists">
              Playlists
            </button>
            <button class="lib-tab" data-tab="liked">Liked Songs</button>
            <button class="lib-tab" data-tab="downloads">Downloads</button>
          </div>
          <div id="libraryContent" class="library-content"></div>
        </section>

        <!-- NOW PLAYING SCREEN (full player) -->
        <section id="nowPlayingScreen" class="screen">
          <div class="player-full">
            <button class="player-back-btn" id="playerBackBtn">
              <i class="fas fa-chevron-down"></i>
            </button>
            <div class="player-artwork-large" id="playerArtworkLarge">
              <i class="fas fa-music"></i>
            </div>
            <div class="player-info">
              <h2 class="player-title" id="playerTitle">—</h2>
              <p class="player-artist" id="playerArtist">—</p>
              <p class="player-album" id="playerAlbum"></p>
              <p class="player-release" id="playerRelease"></p>
            </div>
            <div class="player-progress-container">
              <span class="player-time" id="playerCurrentTime">0:00</span>
              <div class="player-progress-bg" id="playerProgressBg">
                <div class="player-progress-fill" id="playerProgressFill"></div>
              </div>
              <span class="player-time" id="playerDuration">0:00</span>
            </div>
            <div class="player-controls">
              <button id="shuffleBtn"><i class="fas fa-random"></i></button>
              <button id="playerPrevBtn">
                <i class="fas fa-backward-step"></i>
              </button>
              <button id="playerPlayPauseBtn" class="player-play-btn">
                <i class="fas fa-play"></i>
              </button>
              <button id="playerNextBtn">
                <i class="fas fa-forward-step"></i>
              </button>
              <button id="repeatBtn"><i class="fas fa-redo"></i></button>
            </div>
            <div class="player-actions">
              <button id="playerLikeBtn"><i class="far fa-heart"></i></button>
              <button id="playerDownloadBtn">
                <i class="fas fa-download"></i>
              </button>
              <button id="playerAddToPlaylistBtn">
                <i class="fas fa-plus"></i>
              </button>
              <button id="queueBtn" title="Queue">
                <i class="fas fa-list"></i>
              </button>
              <button id="autoplayToggleBtn" title="Autoplay">
                <i class="fas fa-infinity"></i>
              </button>
              <button id="lyricsBtn" title="Lyrics">
                <i class="fas fa-microphone-alt"></i>
              </button>
            </div>
            <!-- Sleep timer display -->
            <div
              class="sleep-timer"
              id="sleepTimerContainer"
              style="display: none"
            >
              <i class="fas fa-clock"></i>
              <span id="sleepTimerDisplay">0:00</span>
            </div>
          </div>
          <!-- Queue panel -->
          <div class="queue-panel" id="queuePanel" style="display: none">
            <div class="queue-header">
              <h3>Queue</h3>
              <button id="closeQueueBtn"><i class="fas fa-times"></i></button>
            </div>
            <div id="queueListContainer" class="track-list"></div>
          </div>
          <!-- Lyrics overlay -->
          <div class="lyrics-overlay" id="lyricsOverlay" style="display: none">
            <div class="lyrics-header">
              <h3>Lyrics</h3>
              <button id="closeLyricsBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="lyrics-content" id="lyricsContent">
              <div class="empty-placeholder">Loading lyrics...</div>
            </div>
          </div>
        </section>
      </main>

      <!-- NOW PLAYING BAR (persistent) -->
      <div class="now-playing-bar" id="nowPlayingBar">
        <div class="bar-left" id="barLeft">
          <div class="bar-art" id="albumArtContainer">
            <i class="fas fa-music"></i>
          </div>
          <div class="bar-meta">
            <div class="bar-title" id="currentTitle">—</div>
            <div class="bar-artist" id="currentArtist">Select a track</div>
          </div>
        </div>
        <div class="bar-center">
          <div class="bar-controls">
            <button id="shuffleMiniBtn" title="Shuffle">
              <i class="fas fa-random"></i>
            </button>
            <button id="prevButton" title="Previous">
              <i class="fas fa-backward-step"></i>
            </button>
            <button
              id="playPauseButton"
              class="bar-play-btn"
              title="Play / Pause"
            >
              <i class="fas fa-play"></i>
            </button>
            <button id="nextButton" title="Next">
              <i class="fas fa-forward-step"></i>
            </button>
            <button id="repeatMiniBtn" title="Repeat">
              <i class="fas fa-redo"></i>
            </button>
          </div>
          <div class="bar-progress-wrap">
            <span id="currentTimeLabel" class="bar-time">0:00</span>
            <div class="progress-bg" id="progressBg">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="durationLabel" class="bar-time">0:00</span>
          </div>
        </div>
        <div class="bar-right">
          <i class="fas fa-volume-low bar-vol-icon"></i>
          <input
            type="range"
            id="volumeControl"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
          />
          <i class="fas fa-volume-high bar-vol-icon"></i>
        </div>
      </div>

      <!-- BOTTOM NAVIGATION -->
      <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-screen="homeScreen">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </button>
        <button class="nav-item" data-screen="searchScreen">
          <i class="fas fa-search"></i>
          <span>Search</span>
        </button>
        <button class="nav-item" data-screen="libraryScreen">
          <i class="fas fa-music"></i>
          <span>Library</span>
        </button>
      </nav>
    </div>

    <script src="app.js"></script>
   <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully.'))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
